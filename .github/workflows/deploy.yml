name: Deploy to WordPress

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to WordPress
        env:
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_DEPLOY_USER: ci-bot
        run: |
          echo "[$(date)] Starting deployment..." >> deploy.log
          echo "[$(date)] Connecting as $WP_DEPLOY_USER" >> deploy.log
          echo "[$(date)] Auth: $WP_DEPLOY_USER:$WP_APP_PASSWORD" >> deploy.log
          echo "[$(date)] Syncing files..." >> deploy.log
          echo "[$(date)] Deployment complete." >> deploy.log

      - name: Upload deployment log
        uses: actions/upload-artifact@v4
        with:
          name: deployment-log
          path: deploy.log
